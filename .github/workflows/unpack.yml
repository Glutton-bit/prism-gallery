name: Unpack Zip
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip to repo root
        shell: bash
        run: |
          mkdir -p _unpack
          for z in *.zip; do
            [ -f "$z" ] && unzip -o -q "$z" -d _unpack
          done
          PKG_FILE=$(find _unpack -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "Could not find package.json!"
            ls -la _unpack
            exit 1
          fi
          PKG_DIR=$(dirname "$PKG_FILE")
          echo "Found project in: $PKG_DIR"
          shopt -s dotglob
          cp -rf "$PKG_DIR"/* .
          rm -rf _unpack ./*.zip
          echo "=== FILES IN SRC ==="
          find src -maxdepth 4 -type f | sort

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack project files" || echo "Nothing to commit"
          git push
