name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install && npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Restore AVIF WASM decoder
        run: mkdir -p public/codecs && cp $(find node_modules/@jsquash/avif -name avif_dec.wasm | head -n 1) public/codecs/avif_dec.wasm

      - name: Prepare static export
        run: node scripts/prep.cjs

      - name: Build static web bundle
        run: npm run build

      - name: Add Android project
        run: npx cap add android

      - name: Add permissions and sync Android
        run: node -e 'const fs=require("fs"),p="android/app/src/main/AndroidManifest.xml";let m=fs.readFileSync(p,"utf8");if(!m.includes("READ_MEDIA_IMAGES")){m=m.replace("<application","<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />\n    <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />\n    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />\n\n    <application android:requestLegacyExternalStorage=\"true\"");fs.writeFileSync(p,m);}' && npx cap sync android

      - name: Build Debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-gallery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk 
